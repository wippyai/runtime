version: "1.0"
namespace: app
entries:
  - name: cdcdb
    kind: db.sql.sqlite
    file: ":memory:"
    lifecycle:
      auto_start: true
  - name: changes
    kind: db.cdc.sqlite
    db_resource: app:cdcdb
    lifecycle:
      auto_start: true
  - name: sql_tests
    kind: security.policy
    policy:
      effect: allow
      actions: db.get
      resources: app:cdcdb
  - name: cdc_tests
    kind: security.policy
    policy:
      effect: allow
      actions: [cdc.source, cdc.subscribe]
      resources: [app:changes, app:dynamic_changes]
  - name: registry_tests
    kind: security.policy
    policy:
      effect: allow
      actions: [registry.get, registry.apply]
      resources: '*'
  - name: terminal
    kind: terminal.host
    lifecycle:
      auto_start: true
  - name: test_runner
    kind: process.lua
    meta:
      command:
        name: test
        use_case: test
    source: file://main.lua
    method: main
    modules: [io, time, sql, cdc, channel, registry]
    security:
      actor:
        id: sqlite-native-tests
      policies: [app:sql_tests, app:cdc_tests, app:registry_tests]
