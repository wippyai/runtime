version: "1.0"
namespace: app.test.eval

entries:
  - name: runner_compile
    kind: function.lua
    meta:
      type: test
      suite: eval
      description: eval_runner compile function
    source: file://runner_compile.lua
    method: main
    modules:
      - eval_runner
      - json
    imports:
      assert: app.lib:assert

  - name: runner_run
    kind: function.lua
    meta:
      type: test
      suite: eval
      description: eval_runner run function
    source: file://runner_run.lua
    method: main
    modules:
      - eval_runner
      - json
    imports:
      assert: app.lib:assert

  - name: runner_allow_classes
    kind: function.lua
    meta:
      type: test
      suite: eval
      description: eval_runner allow_classes feature
    source: file://runner_allow_classes.lua
    method: main
    modules:
      - eval_runner
    imports:
      assert: app.lib:assert
    security:
      policies:
        - app.test.eval:policy_allow_classes_run
        - app.test.eval:policy_allow_classes_module
        - app.test.eval:policy_allow_classes_class

  - name: runner_imports
    kind: function.lua
    meta:
      type: test
      suite: eval
      description: eval_runner imports feature
    source: file://runner_imports.lua
    method: main
    modules:
      - eval_runner
      - json
    imports:
      assert: app.lib:assert
    security:
      policies:
        - app.test.eval:policy_imports_run
        - app.test.eval:policy_imports_module
        - app.test.eval:policy_imports_import

  # Policies granting runner_allow_classes exactly the eval capabilities it exercises.
  - name: policy_allow_classes_run
    kind: security.policy
    policy:
      actions: eval.run
      resources: "*"
      effect: allow

  - name: policy_allow_classes_module
    kind: security.policy
    policy:
      actions: eval.module
      resources: http_client
      effect: allow

  - name: policy_allow_classes_class
    kind: security.policy
    policy:
      actions: eval.class
      resources:
        - network
        - io
      effect: allow

  # Policies granting runner_imports exactly the eval capabilities it exercises.
  - name: policy_imports_run
    kind: security.policy
    policy:
      actions: eval.run
      resources: "*"
      effect: allow

  - name: policy_imports_module
    kind: security.policy
    policy:
      actions: eval.module
      resources: json
      effect: allow

  - name: policy_imports_import
    kind: security.policy
    policy:
      actions: eval.import
      resources: app.lib:test_sdk
      effect: allow
