# SPDX-License-Identifier: MPL-2.0
#
# Minimal cluster configuration examples for the Wippy runtime.
#
# Cluster formation follows the Consul/Nomad model: every node ships the
# same gossip seed list (membership.join_addrs) plus a bootstrap_expect
# count, joins the gossip mesh, and the initial servers form raft quorum
# automatically once enough peers are visible. There is no static peer
# list to enumerate and no "new vs existing" state to flip by hand.
#
# Three topologies are shown below; use one.
#
# For several instances on one machine, membership.bind_port: 0 and
# internode.bind_port: 0 ask the OS for available ports. The internode listener
# stays bound while its port is published in membership metadata; startup never
# releases a probe socket and tries to reclaim it. Read LocalNode().Addr and its
# internode_port metadata after Start succeeds to obtain actual endpoints.
# Discovery and peer authorization remain the application's responsibility.

# ---------------------------------------------------------------------------
# 1. Single node (development). Cluster enabled with no peers: the one node
#    bootstraps itself immediately (bootstrap_expect defaults to 1).
# ---------------------------------------------------------------------------
cluster:
  enabled: true
  name: "dev-1"            # stable per-node id; must be unique across the cluster

# ---------------------------------------------------------------------------
# 2. Three-server cluster (all nodes are raft voters). Every node ships the
#    same join_addrs and bootstrap_expect: 3. Quorum forms once all three are
#    visible in gossip. This is the simplest production shape.
# ---------------------------------------------------------------------------
cluster:
  enabled: true
  name: "${POD_NAME}"      # e.g. injected per node
  membership:
    join_addrs: "node-0:7946,node-1:7946,node-2:7946"  # gossip seeds (any subset works)
    # secret_key / secret_file: shared gossip encryption key. Nodes with
    # different keys never see each other, so this also scopes the cluster.
    # gossip_interval: 500ms       # UDP gossip cadence; lower is faster but noisier.
    # push_pull_interval: 5s       # TCP full-state anti-entropy cadence.
    # dead_node_reclaim_time: 30s  # same-name/different-address reclaim after hard death.
  # Reliable mesh admission: accepted queued + writer-owned payloads.
  # Shared across actor/PG and Raft classes. These are ceilings, not allocations.
  # Gossip/surface queues, encoding buffers and other heap usage are separate.
  # Context-aware sends wait for capacity; ordinary sends refuse before transfer.
  # An individual frame larger than peer_bytes or total_bytes is refused.
  # internode:
  #   outbound:
  #     batch_bytes: 1048576 # scheduling target; one larger frame may run alone
  #     peer_entries: 256
  #     peer_bytes: 536870912
  #     total_entries: 4096
  #     total_bytes: 2147483648
  #     # Control reserves are carved out of totals; defaults shown (zero disables).
  #     # Ordinary frame size must fit peer_bytes - control.peer_bytes and
  #     # total_bytes - control.total_bytes. These are fixed capacity limits, not latency guarantees.
  #     # Raft snapshots still share the control class; this protects against
  #     # application backlog, not snapshot or on-wire head-of-line blocking.
  #     control:
  #       peer_entries: 16
  #       peer_bytes: 1048576
  #       total_entries: 256
  #       total_bytes: 16777216
  raft:
    bootstrap_expect: 3    # size of the initial voter quorum
    # startup_timeout: 30s      # fail startup if no leader becomes known
    # startup_poll_interval: 100ms # bounded startup-only observation
    # KV naming participants enroll before application admission. These limits
    # bound snapshot work; refresh_interval is a lost-update backstop, not a lease.
    # naming:
    #   max_participants: 4096  # active + retained retired node identities
    #   max_entries: 16384
    #   max_value_bytes: 4194304
    #   max_wire_bytes: 16777216
    #   max_concurrent_requests: 8 # plus at most 8 refusal-only workers
    #   max_redirects: 4
    #   request_timeout: 5s
    #   refresh_interval: 1s
    #   strong:
    #     ack_deadline: 10s       # an earlier caller deadline is always respected
    #     result_wait_grace: 2s  # zero allowed; never extends caller deadline
    #     results:              # attempt evidence; retention never expires names
    #       max_entries: 4096
    #       max_bytes: 16777216  # reserved serialized key/value bytes
    #       max_record_bytes: 1048576
    #       retention: 1m
    #       reclaim_batch: 64
    #     retry_interval: 1s     # retry after failed authority barrier
    #   cleanup:
    #     max_pending: 256     # distinct validated exit owners, including retries
    #     max_bytes: 1048576   # retained PID/key bytes; count bounds object overhead
    #     batch_size: 32      # owners per authority snapshot
    #     retry_interval: 1s  # retry policy, not process-death evidence
    # Cleanup is held in memory. Forced stop reports unfinished owners;
    # queue admission is not a durable receipt across runtime crashes.
    # Global-FSM name join snapshots: reject oversized snapshots as a whole.
    # The KV backend uses the separate naming limits below.
    # join:
    #   timeout: 10s        # authority barrier / reply-wait budget
    #   max_entries: 65536
    #   max_bytes: 16777216 # encoded response size
    #   max_concurrent: 4  # captures and outgoing join waits per service

# ---------------------------------------------------------------------------
# 3. Bounded-raft cluster: a few raft servers + many gossip-only clients.
#    Servers run raft (voters/standbys, capped by max_voters/max_standbys);
#    clients route names over gossip + the dissemination plane with no raft
#    Node. Pick the role per node — e.g. by StatefulSet ordinal.
# ---------------------------------------------------------------------------
cluster:
  enabled: true
  name: "${POD_NAME}"
  failure_domain: "${ZONE}"   # optional: spreads voters across domains
  membership:
    join_addrs: "node-0:7946,node-1:7946,node-2:7946"
    secret_key: "${GOSSIP_SECRET}"
    # dead_node_reclaim_time: 30s # set lower, e.g. 3s, only when same-name pod IP reuse is expected and false-dead probes are rare.
  raft:
    role: server              # "server" (default) runs raft; "client" is gossip-only
    bootstrap_expect: 5       # initial server quorum (set on the server nodes)
    max_voters: 5             # raft voters cap (odd; rest become non-voting standbys)
    max_standbys: 4           # non-voting raft members kept warm for promotion
    # priority: 100           # lower wins voter election ties; pin preferred voters
  # On a client node, set:
  #   raft:
  #     role: client          # no raft Node; pure gossip + dissem routing

# ---------------------------------------------------------------------------
# Advanced raft tuning (all optional, sane defaults). Timeouts are Go
# durations. The runtime enforces the hashicorp/raft invariants
# (ElectionTimeout >= HeartbeatTimeout, LeaderLeaseTimeout coupled to
# HeartbeatTimeout) so no combination of these can produce a config raft
# rejects:
#   raft:
#     heartbeat_timeout: 3s
#     election_timeout: 3s
#     commit_timeout: 500ms
#     snapshot_interval: 2m
#     snapshot_threshold: 8192
#     trailing_logs: 10240
#     max_append_entries: 16
#     reconcile_debounce: 2s
#     reconcile_timeout: 2s
#     # AP delete-retention mode:
#     #   0    = correctness-first cache fences; no age-only expiry.
#     #   >0   = memory-bound mode; safe only if it exceeds max offline/partition time.
#     # Durable per-peer causal ACK / membership-epoch retirement is the stronger
#     # future compaction mode; do not treat a TTL as causal proof.
#     global_dissem_tombstone_retention: 0
#   kv_crdt_tombstone_retention: 0
