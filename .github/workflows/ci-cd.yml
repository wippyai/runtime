# SPDX-License-Identifier: MPL-2.0

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true

      - name: Run linter
        env:
          CGO_ENABLED: 1
          GOFLAGS: -buildvcs=false
        run: make lint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup msys (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-sqlite3
          path-type: inherit

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
        env:
          MSYSTEM: MINGW64

      - name: Install dependencies
        if: matrix.os != 'windows-latest'
        run: go mod download

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: go mod download

      - name: Run tests
        if: matrix.os != 'windows-latest'
        env:
          GORACE: "halt_on_error=1"
          SKIP_TEMPORAL_TESTS: "1"
          SKIP_CLOUDSTORAGE_TESTS: "1"
          SKIP_DOCKER_TESTS: "1"
        run: make test

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        env:
          GORACE: "halt_on_error=1"
          SKIP_TEMPORAL_TESTS: "1"
          SKIP_CLOUDSTORAGE_TESTS: "1"
          SKIP_DOCKER_TESTS: "1"
        run: make test

  test-native-app:
    name: Test native Wippy Lua application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Run native application suite
        env:
          SKIP_NETWORK_TESTS: "1"
          SKIP_SQS_TESTS: "1"
        run: bash tests/app/test.sh

  postgres-registry:
    name: Test (PostgreSQL registry)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true

      - name: Run PostgreSQL registry tests
        env:
          GORACE: "halt_on_error=1"
          WIPPY_POSTGRES_HISTORY_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./system/registry ./system/registry/history/postgres

  test-sqlite-cdc:
    name: Test SQLite CDC (Linux, CGO, race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Run tagged SQLite CDC tests and native Lua fixture
        env:
          CGO_ENABLED: 1
          GORACE: "halt_on_error=1"
          SKIP_TEMPORAL_TESTS: "1"
          SKIP_CLOUDSTORAGE_TESTS: "1"
          SKIP_DOCKER_TESTS: "1"
        run: make test-cdc-sqlite

  test-postgres-cdc:
    name: Test PostgreSQL CDC (integration, race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true
      - name: Start isolated logical-replication database
        run: |
          docker run --rm -d --name wippy-cdc-ci \
            -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1:5432:5432 \
            postgres:17-alpine \
            -c wal_level=logical -c max_replication_slots=32 -c max_wal_senders=32
          for attempt in {1..30}; do
            if docker exec wippy-cdc-ci pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker exec wippy-cdc-ci psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE cdc_repl WITH LOGIN SUPERUSER REPLICATION'
      - name: Run PostgreSQL CDC regression suite
        env:
          GORACE: halt_on_error=1
          WIPPY_CDC_IT_ADMIN_DSN: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
          WIPPY_CDC_IT_REPL_DSN: postgres://cdc_repl@127.0.0.1:5432/postgres?sslmode=disable&replication=database
        run: make test-cdc-postgres
      - name: Stop test database
        if: always()
        run: docker stop wippy-cdc-ci
