name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run linter
        env:
          CGO_ENABLED: 1
          GOFLAGS: -buildvcs=false
        run: make lint

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Setup msys (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-sqlite3
          path-type: inherit

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
        env:
          MSYSTEM: MINGW64

      - name: Install dependencies
        if: matrix.os != 'windows-latest'
        run: go mod download

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: go mod download

      - name: Run tests
        if: matrix.os != 'windows-latest'
        env:
          GORACE: "halt_on_error=1"
          SKIP_TEMPORAL_TESTS: "1"
          SKIP_CLOUDSTORAGE_TESTS: "1"
          SKIP_DOCKER_TESTS: "1"
        run: make test

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        env:
          GORACE: "halt_on_error=1"
          SKIP_TEMPORAL_TESTS: "1"
          SKIP_CLOUDSTORAGE_TESTS: "1"
          SKIP_DOCKER_TESTS: "1"
        run: make test

      - name: Run SQL module tests without CGO
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./runtime/lua/modules/sql

  test-native-exec:
    name: Native exec (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-sqlite3
          path-type: inherit

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
        env:
          MSYSTEM: MINGW64

      - name: Run native exec tests
        if: matrix.os != 'windows-latest'
        env:
          GORACE: halt_on_error=1
        run: go test -race -count=1 ./api/service/exec/... ./service/exec/native/...

      - name: Run native exec tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        env:
          GORACE: halt_on_error=1
        run: go test -race -count=1 ./api/service/exec/... ./service/exec/native/...

  test-build-features:
    name: Build features (${{ matrix.os }}, ${{ matrix.features || 'default' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, features: '' }
          - { os: ubuntu-latest, features: tailscale }
          - { os: ubuntu-latest, features: treesitter }
          - { os: ubuntu-latest, features: 'tailscale treesitter' }
          - { os: macos-26, features: '' }
          - { os: macos-26, features: 'tailscale treesitter' }
          - { os: windows-latest, features: '' }
          - { os: windows-latest, features: 'tailscale treesitter' }
    env:
      CGO_ENABLED: '1'
      WIPPY_FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-toolchain mingw-w64-x86_64-sqlite3
          path-type: inherit
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
        env:
          MSYSTEM: MINGW64
      - name: Check feature dependencies and boot tests
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          bash .github/scripts/test-build-features.sh "$WIPPY_FEATURES"
          go test -race -short -tags "fts5 sqlite_vec sqlite_preupdate_hook $WIPPY_FEATURES" ./boot ./boot/components/service ./boot/components/runtime/lua ./cmd/app
      - name: Check feature dependencies and boot tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          bash .github/scripts/test-build-features.sh "$WIPPY_FEATURES"
          go test -race -short -tags "fts5 sqlite_vec sqlite_preupdate_hook $WIPPY_FEATURES" ./boot ./boot/components/service ./boot/components/runtime/lua ./cmd/app
      - name: Test optional modules (macOS)
        if: matrix.os == 'macos-26' && matrix.features != ''
        run: make test-optional-features
      - name: Test SQLite connections and history
        if: matrix.features == '' && matrix.os != 'windows-latest'
        run: |
          go test -race -count=1 ./internal/sqliteconn ./service/sql/... ./system/registry/history/sqlite
          go test -race -count=1 -tags 'fts5 sqlite_vec sqlite_preupdate_hook' ./internal/sqliteconn ./service/sql/... ./system/registry/history/sqlite
      - name: Test SQLite connections and history (Windows)
        if: matrix.features == '' && matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          go test -race -count=1 ./internal/sqliteconn ./service/sql/... ./system/registry/history/sqlite
          go test -race -count=1 -tags 'fts5 sqlite_vec sqlite_preupdate_hook' ./internal/sqliteconn ./service/sql/... ./system/registry/history/sqlite
      - name: Test rooted filesystem
        if: matrix.features == '' && matrix.os != 'windows-latest'
        run: go test -race -count=1 ./service/fs/directory ./runtime/lua/modules/fs
      - name: Test rooted filesystem (Windows)
        if: matrix.features == '' && matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: go test -race -count=1 ./service/fs/directory ./runtime/lua/modules/fs
      - name: Build and smoke check
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          make build-wippy-local WIPPY_VERSION=feature-ci
          "./dist/wippy-$(go env GOOS)-$(go env GOARCH)" --help
      - name: Build and smoke check (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          make build-wippy-local WIPPY_VERSION=feature-ci
          "./dist/wippy-$(go env GOOS)-$(go env GOARCH)" --help

  test-native-app:
    name: Test native Wippy Lua application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check version stamping
        run: bash .github/scripts/test-version-stamp.sh
      - name: Run native application suite
        env:
          SKIP_NETWORK_TESTS: "1"
          SKIP_SQS_TESTS: "1"
        run: bash tests/app/test.sh

  test-linux-confinement:
    name: Linux confinement (required positive suite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Create empty delegated parent and runtime leaf
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          delegated="/sys/fs/cgroup/wippy-confine-ci"
          sudo mkdir -p "$delegated/runtime"
          sudo chown -R "$(id -u):$(id -g)" "$delegated"
          printf '+memory +pids' | sudo tee "$delegated/cgroup.subtree_control" >/dev/null
          printf '%s' "$$" | sudo tee "$delegated/runtime/cgroup.procs" >/dev/null
          WIPPY_REQUIRE_CONFINEMENT=1 \
            WIPPY_REQUIRE_CONFINEMENT_CGROUP=1 \
            go test -race -count=1 ./service/exec/native/...

  postgres-registry:
    name: Test (PostgreSQL registry)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run PostgreSQL registry tests
        env:
          GORACE: "halt_on_error=1"
          WIPPY_POSTGRES_HISTORY_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./system/registry ./system/registry/history/postgres ./boot/deps/hub

  test-sqlite-cdc:
    name: Test SQLite CDC (Linux, CGO, race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tagged SQLite CDC tests and native Lua fixture
        env:
          CGO_ENABLED: 1
          GORACE: "halt_on_error=1"
          SKIP_TEMPORAL_TESTS: "1"
          SKIP_CLOUDSTORAGE_TESTS: "1"
          SKIP_DOCKER_TESTS: "1"
        run: make test-cdc-sqlite

  test-postgres-cdc:
    name: Test PostgreSQL CDC (integration, race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start isolated logical-replication database
        run: |
          docker run --rm -d --name wippy-cdc-ci \
            -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1:5432:5432 \
            postgres:17-alpine \
            -c wal_level=logical -c max_replication_slots=32 -c max_wal_senders=32
          for attempt in {1..30}; do
            if docker exec wippy-cdc-ci pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker exec wippy-cdc-ci psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE cdc_repl WITH LOGIN SUPERUSER REPLICATION'
      - name: Run PostgreSQL CDC regression suite
        env:
          GORACE: halt_on_error=1
          WIPPY_CDC_IT_ADMIN_DSN: postgres://postgres@127.0.0.1:5432/postgres?sslmode=disable
          WIPPY_CDC_IT_REPL_DSN: postgres://cdc_repl@127.0.0.1:5432/postgres?sslmode=disable&replication=database
        run: make test-cdc-postgres
      - name: Stop test database
        if: always()
        run: docker stop wippy-cdc-ci
